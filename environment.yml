# One environment. Everything the corpus needs: rendering, degradation, tests.
#
# PINS ARE EXACT, NOT PREFERENCES. Degraded images are corpus data: their
# hashes go in a manifest, and a version bump that shifts one pixel
# invalidates every prediction made against the old images.
name: docparse

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
      - Pillow==12.2.0
      - PyYAML==6.0.3
      - typer==0.27.1
      - rich==14.3.0
      # Faker lands on the page: it supplies the names, addresses and
      # references the renderer draws AND the transcript records, so a version
      # that changes a provider changes the ground truth, not just a pixel. It
      # was the last unpinned input; the two machines agreeing was a
      # coincidence of install date, not a pin.
      - faker==40.37.0

      # Degradation (generators/degradation/). numpy and opencv are the only
      # runtime dependencies the re-derived ink, paper, geometry and camera
      # effects need — see generators/degradation/effects.py and geometry.py.
      # This used to also pin numba, scikit-image, scikit-learn, requests and
      # matplotlib, as the runtime imports of a third-party paper-damage
      # library this project no longer depends on (see
      # docs/superpowers/specs/2026-09-01-cross-machine-determinism-design.md
      # §3); those five are removed because nothing in this repository
      # imports any of them — verified with:
      #   grep -rn "skimage\|sklearn\|matplotlib\|requests\|numba" \
      #       --include="*.py" generators/ scoring/ *.py
      - numpy==2.3.5
      - opencv-python-headless==4.13.0.92

      # Tooling.
      - pytest
      - pytest-cov
      - ruff
      - mypy
