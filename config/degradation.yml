# Image degradation: two intake channels, three severities each.
#
# Production receives scanned documents, so the clean-render corpus measures a
# condition production does not have. This file declares what "degraded" means.
#
# TWO LADDERS, NOT ONE. A flatbed or ADF scanner and a phone photograph damage a
# page in different ways, and merging them into a single severity scale makes
# "which intake channel breaks it?" unanswerable. Each family is its own ladder;
# a result is attributed to the channel that produced it.
#
#   scan   flatbed / ADF: lamp falloff, roller streaks, sensor noise, small
#          skew, halftone thresholding, compression. NO perspective and NO cast
#          shadow -- the platen holds the page flat and square.
#   photo  phone on a desk: perspective foreshortening, rotation, cast shadow,
#          uneven lighting, folds, lens blur, sensor noise, JPEG.
#
# ORDERING IS LOAD-BEARING and is enforced in code, not here. Ink and paper
# phases run on the FLAT page, before any geometry, because a crease belongs to
# the paper and must be transformed with it; painting one across an already
# skewed image reads as a defect in the file rather than in the document. Blur,
# noise and compression run last, because they belong to the sensor and the
# file.
#
# EVERY KEY IS REQUIRED, including the ones that are empty. `ink: []` states
# that a tier deliberately leaves the ink alone; omitting it would leave a
# reader unable to tell a decision from an oversight.
#
# Augmentation names must be registered in generators/degradation/augment.py.
# `InkBleed`, `LightingGradient` and `ShadowCast` are this project's own
# re-derivation, not the Augraphy library's — Augraphy evaluated transcendental
# functions (its libm), which glibc and Apple's libm do not agree on, so the
# same seed produced different pixels on Linux and macOS. The registry stays an
# allow-list rather than a passthrough to a whole catalogue, so a typo here
# becomes a startup diagnostic naming the valid options. See
# generators/degradation/effects.py and
# docs/superpowers/specs/2026-09-01-cross-machine-determinism-design.md.
#
# ORDER WITHIN A PHASE IS LOAD-BEARING TOO, and this is easy to miss because it
# reads as cosmetic. Every effect in a tier's `ink:` and `paper:` lists draws
# from ONE generator, seeded once per page and passed down the list in order --
# see `apply_effects` in generators/degradation/augment.py. So swapping two
# entries does not merely reorder two operations: the second entry now consumes
# the draws the first one used to, and every sampled parameter after it shifts.
# The page comes out different in every pixel. Under Augraphy each augmentation
# carried its own state and this was safe; it is not safe now. Reordering a
# phase is a corpus revision, exactly like changing a number in it. Pinned by
# tests/test_degradation_augment.py.
#
# ROLLER STREAKS AND FOLD RIDGES ARE ALSO THIS PROJECT'S OWN. Augraphy's
# `Folding` and `DirtyRollers` produced exactly the artefacts this study wants
# but were not seedable — five runs at one seed gave five different images,
# because both delegated to helpers whose RNG state nothing reached. Their
# artefacts are provided instead by `marks:` below, implemented in
# generators/degradation/geometry.py and drawing all randomness from the
# tier's own seeded generator.
#
# A TIER MUST DISCRIMINATE. The point of a severity ladder is to find where a
# system breaks, so a tier that no system can read measures nothing -- it adds a
# floor every system sits on equally. Both `heavy` tiers were first written
# harsher than they are now and pulled back after looking at the output: they
# should be at the edge of legibility for a human, not past it.
#
# A LADDER MUST NOT REVERSE. Pulling a rung back is a judgement call; pulling it
# back PAST the rung below it is a bug, and one that hides well -- a tier whose
# blur and warp still rise reads as monotonic on a sharpness metric while the
# lighting quietly improves. `photo-heavy` shipped that way once (see its
# ShadowCast below). Every dimension that means "worse" when it grows must be
# non-decreasing across a family's rungs, and `jpeg` -- a quality number, so it
# runs the other way -- non-increasing. Pinned by
# tests/test_degradation_ladder_monotonic.py, which compares each rung to the
# one below it rather than checking each in isolation.

families:

  # ---------------------------------------------------------------- scanner
  scan:
    description: >
      Flatbed or sheet-fed scanner. The page is held flat and square, so the
      geometry is a small skew rather than a perspective warp.
    tiers:

      - name: light
        suffix: scan1
        description: A well-maintained office scanner, lightly compressed.
        ink:
          # LIGHTENED so this rung matches its own description -- but note what
          # that did NOT fix. scan-light used to retain 0.293 of the clean
          # page's stroke detail against scan-moderate's 0.282: a step of
          # 0.981, so moderate was nearly a no-op, and on 29 of 61 pages it
          # came out SHARPER than light. Cleaning this tier's ink, blur and
          # JPEG moved it only to 0.318, because most of the loss is not here:
          # the skew resamples the whole page bilinearly, and every tier pays
          # that once. ~0.3 is the floor for anything with geometry, so the
          # ladder has to be opened downward, on moderate and heavy, not
          # upward on light.
          - augmentation: InkBleed
            intensity: [0.02, 0.06]
            kernel: 3
            doc_types: [bank_statements, receipts, invoices]
        paper:
          - augmentation: LightingGradient
            max_brightness: 255
            direction: 90
            doc_types: [bank_statements, receipts, invoices]
          # THERMAL FADE, RECEIPTS ONLY. Thermal coating reacts to heat and UV,
          # then moisture, skin oils and friction, and fades unevenly rather
          # than as a uniform contrast loss -- see
          # docs/research/2026-09-02-degradation-candidates.md §5.1. It has no
          # meaning on a laser/inkjet bank statement or invoice, which is what
          # `doc_types: [receipts]` gates. LAST in this list on purpose: every
          # earlier effect's draws stay exactly what they were before this
          # effect existed. `patterns:` is sampled per page rather than fixed
          # per tier, because real receipts fade several different ways --
          # uniformly with storage heat, or heavier toward whichever edge stuck
          # out of a wallet -- and a whole tier fading identically would read
          # as synthetic. The same five patterns are declared everywhere below;
          # both the strength ranges and this set are a first guess, not yet
          # tuned against any model's scores.
          - augmentation: ThermalFade
            strength: [0.10, 0.25]
            patterns: [uniform, top, bottom, left, right]
            doc_types: [receipts]
        marks: []          # a well-maintained scanner leaves no roller marks
        geometry:
          mode: skew
          rotation_deg: [-0.8, 0.8]
          margin: [0.01, 0.02]
        camera:
          blur: [0.05, 0.15]
          noise_sigma: [1, 2]
          jpeg: [92, 98]

      - name: moderate
        suffix: scan2
        description: >
          A worn ADF: roller streaks down the feed direction, lamp falloff to
          one side, heavier compression.
        ink:
          # DEEPENED to put a real step between light and moderate. See the
          # note on scan-light: this rung sat at 0.307 of clean against
          # light's 0.318, which is no step at all.
          - augmentation: InkBleed
            intensity: [0.14, 0.28]
            kernel: 3
            doc_types: [bank_statements, receipts, invoices]
        paper:
          - augmentation: LightingGradient
            max_brightness: 248
            direction: 45
            doc_types: [bank_statements, receipts, invoices]
          # Thermal fade, receipts only -- see the note on scan-light. LAST in
          # this list, same reason. First guess, not yet tuned.
          - augmentation: ThermalFade
            strength: [0.25, 0.45]
            patterns: [uniform, top, bottom, left, right]
            doc_types: [receipts]
        marks:
          - mark: roller_streaks
            count: [3, 6]
            width: [4, 11]
            strength: [0.07, 0.15]
        geometry:
          mode: skew
          rotation_deg: [-2.0, 2.0]
          margin: [0.01, 0.03]
        camera:
          blur: [0.5, 0.95]
          noise_sigma: [3, 5]
          jpeg: [62, 78]

      - name: heavy
        suffix: scan3
        description: >
          A tired device near the end of its life: heavy roller marking, ink
          spread, soft focus and aggressive compression. The tier that should
          break small digits first -- and it is meant to be readable, with
          effort, or it discriminates between nothing.
        ink:
          # MOVED DOWN with moderate, to keep the top of the ladder a real step
          # below it rather than being overtaken. Still bounded by the rule
          # above: readable with effort. photo-heavy already runs blur to 2.0
          # and stays legible, so 1.8 here is inside proven ground.
          - augmentation: InkBleed
            intensity: [0.26, 0.44]
            kernel: 5
            doc_types: [bank_statements, receipts, invoices]
        paper:
          - augmentation: LightingGradient
            max_brightness: 240
            direction: 45
            doc_types: [bank_statements, receipts, invoices]
          # Thermal fade, receipts only -- see the note on scan-light. LAST in
          # this list, same reason. First guess, not yet tuned.
          - augmentation: ThermalFade
            strength: [0.45, 0.65]
            patterns: [uniform, top, bottom, left, right]
            doc_types: [receipts]
        marks:
          - mark: roller_streaks
            count: [5, 10]
            width: [8, 22]
            strength: [0.16, 0.32]
        geometry:
          mode: skew
          rotation_deg: [-3.5, 3.5]
          margin: [0.02, 0.04]
        camera:
          blur: [1.0, 1.8]
          noise_sigma: [6, 10]
          jpeg: [32, 50]

  # ------------------------------------------------------------------ photo
  photo:
    description: >
      A phone photograph of the page on a desk. Ported from the predecessor
      repo's receipt pipeline, where the severities were tuned against real
      photographed receipts; the geometry is unchanged, and only the page it is
      applied to is wider.
    tiers:

      - name: light
        suffix: photo1
        description: Held square-ish, good light, minor foreshortening.
        ink:
          - augmentation: InkBleed
            intensity: [0.05, 0.15]
            kernel: 3
            doc_types: [bank_statements, receipts, invoices]
        paper:
          - augmentation: LightingGradient
            max_brightness: 255
            direction: 90
            doc_types: [bank_statements, receipts, invoices]
          # THERMAL FADE, RECEIPTS ONLY -- see the note on scan-light for what
          # this models and why it is gated. LAST in this list, same reason.
          # First guess, not yet tuned against any model's scores.
          - augmentation: ThermalFade
            strength: [0.10, 0.25]
            patterns: [uniform, top, bottom, left, right]
            doc_types: [receipts]
        marks: []          # a flat, unfolded page
        geometry:
          mode: warp
          foreshorten: [0.01, 0.03]
          rotation_deg: [-3, 3]
          margin: [0.05, 0.10]
        camera:
          blur: [0.2, 0.5]
          noise_sigma: [1, 3]
          jpeg: [85, 95]

      - name: moderate
        suffix: photo2
        description: Off-axis, with the photographer's own shadow across a corner.
        ink:
          - augmentation: InkBleed
            intensity: [0.15, 0.30]
            kernel: 5
            doc_types: [bank_statements, receipts, invoices]
        paper:
          - augmentation: LightingGradient
            max_brightness: 245
            direction: 45
            doc_types: [bank_statements, receipts, invoices]
          - augmentation: ShadowCast
            side: bottom
            opacity: [0.25, 0.45]
            doc_types: [bank_statements, receipts, invoices]
          # Thermal fade, receipts only -- see the note on scan-light. LAST in
          # this list, same reason. First guess, not yet tuned.
          - augmentation: ThermalFade
            strength: [0.25, 0.45]
            patterns: [uniform, top, bottom, left, right]
            doc_types: [receipts]
        marks: []          # still unfolded; the damage here is light and angle
        geometry:
          mode: warp
          foreshorten: [0.03, 0.06]
          rotation_deg: [-8, 8]
          margin: [0.07, 0.14]
        camera:
          blur: [0.5, 1.2]
          noise_sigma: [3, 6]
          jpeg: [65, 85]

      - name: heavy
        suffix: photo3
        description: >
          A page that has been folded and put in a pocket, photographed badly
          in poor light.
        ink:
          - augmentation: InkBleed
            intensity: [0.25, 0.45]
            kernel: 5
            doc_types: [bank_statements, receipts, invoices]
        paper:
          - augmentation: LightingGradient
            max_brightness: 235
            direction: 45
            doc_types: [bank_statements, receipts, invoices]
          - augmentation: ShadowCast
            # STRICTLY DARKER THAN MODERATE'S [0.25, 0.45]. It used to be
            # [0.22, 0.38], which made the hardest rung the better-lit one:
            # measured over 40 statements, photo-heavy's darkest decile came
            # out at 143.8 against moderate's 131.2, and its lighting spread
            # at 57.2 against 64.0. Blur and warp still fell correctly, so the
            # ladder read as monotonic on a sharpness metric while reversing
            # on the dimension a human reader actually feels.
            # `side` differs from moderate's on purpose -- the shadow should
            # not fall in the same corner at every severity -- but direction
            # is not severity, and only opacity carries the rung.
            side: top
            opacity: [0.35, 0.55]
            doc_types: [bank_statements, receipts, invoices]
          # Thermal fade, receipts only -- see the note on scan-light. LAST in
          # this list, same reason. First guess, not yet tuned.
          - augmentation: ThermalFade
            strength: [0.45, 0.65]
            patterns: [uniform, top, bottom, left, right]
            doc_types: [receipts]
        marks:
          - mark: fold_ridges
            count: [2, 3]
            strength: [0.06, 0.14]
        geometry:
          mode: warp
          foreshorten: [0.06, 0.11]
          rotation_deg: [-14, 14]
          margin: [0.10, 0.18]
        camera:
          blur: [1.0, 2.0]
          noise_sigma: [6, 11]
          jpeg: [40, 60]

# WHICH PAGES A FULL RUN DEGRADES. Both keys are required: reading this file
# alone must answer "what does `degrade` with no flags produce?", and a missing
# key is an error rather than a silent "all of them".
#
# All three document types, despite receipts scoring at ceiling on clean pages.
# Creating headroom where clean pages have none is exactly what this axis is
# for -- a degraded receipt can separate models that a clean one cannot.
corpus:
  document_types: [bank_statements, receipts, invoices]
  families: [scan, photo]
